kind = "web"
previewPath = "/"
title = "Magnify Website"
version = "1.0.0"
id = "artifacts/magnify-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23687

[services.development]
run = "pnpm --filter @workspace/magnify-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/magnify-website", "run", "build" ]
publicDir = "artifacts/magnify-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23687"
BASE_PATH = "/"
